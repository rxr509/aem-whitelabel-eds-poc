name: Check Shared Updates

# Polls kxs692/aem-whitelabel-boilerplate@demo and pulls the submodule forward
# when it moves. Nothing is required on the upstream side - it is read-only,
# public, and unaware of us.
#
# The push to `source` uses SYNC_BOT_TOKEN rather than GITHUB_TOKEN: a
# GITHUB_TOKEN push neither triggers build-and-sync.yml nor satisfies a branch
# ruleset. Because the PAT push does trigger workflows, build-and-sync is left
# to fire on its own `push: source` trigger instead of being dispatched here.
#
# State is kept on a dedicated branch, not on `source`. Recording a timestamp
# on every poll would otherwise put a commit on the authoring branch every
# time this runs.
#
# IF THE SUBMODULE SILENTLY STOPS UPDATING, READ THIS FIRST:
# GitHub disables scheduled workflows automatically after 60 days with no
# repository activity, and notifies nobody. The workflow still exists and still
# looks correct - it simply never fires again. Check Actions -> Check Shared
# Updates for a "this workflow was disabled" banner, then re-enable with:
#
#     gh workflow enable check-shared-updates.yml
#
# Schedules are best-effort. Expect the daily run to land within a few minutes
# of 09:17 UTC most days, occasionally later. Use workflow_dispatch when an
# update is needed sooner.

on:
  schedule:
    # 09:17 UTC, deliberately off the top of the hour: GitHub's own guidance is
    # that scheduled runs are most delayed at :00, when everyone else's crons
    # fire. An odd minute avoids that queue.
    - cron: '17 9 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Ignore min_spacing_minutes and evaluate every subscriber now'
        type: boolean
        default: false

permissions:
  contents: write   # commit the submodule bump, write the state branch

concurrency:
  group: check-shared-updates
  cancel-in-progress: false

env:
  STATE_BRANCH: automation-state
  STATE_FILE: .last-checked.json

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: source
          submodules: recursive
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Single dependency rather than a full `npm ci`, since this runs often.
      - name: Install YAML parser
        run: npm install --no-save --no-audit --no-fund js-yaml@4

      - name: Evaluate subscribers
        id: evaluate
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCE: ${{ inputs.force || 'false' }}
        run: node .github/scripts/check-shared-updates.mjs

      - name: Pull shared submodule forward
        if: steps.evaluate.outputs.should_update == 'true'
        id: pull
        env:
          SYNC_TOKEN: ${{ secrets.SYNC_BOT_TOKEN }}
        run: |
          set -euo pipefail
          # Resolvable GitHub identity, so the commit is attributed and does not
          # trip require_extra_approval_for_unattributed_changes on the ruleset.
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          before=$(git rev-parse HEAD:shared)
          git submodule update --remote shared
          after=$(git -C shared rev-parse HEAD)

          echo "shared: ${before:0:12} -> ${after:0:12}"

          if git diff --quiet -- shared; then
            echo "gitlink unchanged after --remote; nothing to commit"
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git add shared
          git commit -q -m "chore: auto-pull shared update (detected via scheduled check)"

          if [ -z "${SYNC_TOKEN:-}" ]; then
            echo "SYNC_BOT_TOKEN is empty - secret missing or revoked" >&2
            exit 1
          fi

          # base64 is a derived value, so the runner's automatic masking of the
          # raw secret does not cover it. Register it explicitly.
          encoded=$(printf 'x-access-token:%s' "$SYNC_TOKEN" | base64 -w0)
          echo "::add-mask::$encoded"

          # Replaces the GITHUB_TOKEN header actions/checkout installed. Header
          # form keeps the PAT out of the remote URL and out of push output.
          git config --local --replace-all \
            "http.https://github.com/.extraheader" \
            "AUTHORIZATION: basic $encoded"

          # SYNC_BOT_TOKEN has no expiry, so a 403 later means revoked or
          # permissions changed, not lapsed. Fail loudly here rather than
          # silently pushing with the checkout credential.
          test "$(git config --local --get-all http.https://github.com/.extraheader | wc -l)" -eq 1

          git push origin source
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      # lastSeenSha is computed at evaluate time, so recording it after a failed
      # push would mark the update as done and no later run would retry it - the
      # bump is abandoned until upstream happens to move again.
      - name: Persist state
        if: always() && steps.evaluate.outcome == 'success' && steps.pull.outcome != 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          content=$(node -e "process.stdout.write(Buffer.from(JSON.stringify(require('./state.json').state,null,2)+'\n').toString('base64'))")
          sha=$(node -e "const s=require('./state.json').stateSha; process.stdout.write(s||'')")

          args=(-X PUT "repos/${GITHUB_REPOSITORY}/contents/${STATE_FILE}"
                -f message="chore: record shared poll state"
                -f content="$content"
                -f branch="${STATE_BRANCH}")
          [ -n "$sha" ] && args+=(-f sha="$sha")

          gh api "${args[@]}" --silent
          echo "state written to ${STATE_BRANCH}/${STATE_FILE}"

      - name: Summary
        if: always()
        run: |
          {
            echo "### Shared update check"
            echo
            echo '```json'
            echo '${{ steps.evaluate.outputs.decision }}'
            echo '```'
            echo
            echo "Pushed: ${{ steps.pull.outputs.pushed || 'false' }}"
          } >> "$GITHUB_STEP_SUMMARY"
