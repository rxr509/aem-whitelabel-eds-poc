name: Build and Sync to develop

# Merges the /shared submodule with the active brand's override folder under
# /brands and publishes the flattened result to the `develop` branch, which is
# the default branch and the one Edge Delivery serves. There is no build step
# beyond this flatten-and-copy.
#
# `develop` is fully machine-generated: the publish step wipes it on every run.
# Never commit site code directly to `develop` - author it under /brands (or the
# /shared submodule) on the `source` branch instead, or it will be overwritten.

on:
  push:
    branches:
      - source
  workflow_dispatch:

# develop is force-written, so overlapping runs queue rather than cancel - a run
# killed mid-push would leave develop in a partial state.
concurrency:
  group: build-and-sync-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-and-sync:
    runs-on: ubuntu-latest
    steps:
      # 1. Check out the `source` branch with submodules (pulls in /shared).
      #    The /shared submodule is a public repo, so the default GITHUB_TOKEN
      #    can clone it - no extra token needed.
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: source
          submodules: recursive
          path: source

      # 2. Check out the `develop` branch into a separate directory so we can replace
      #    its contents and push. Uses the default GITHUB_TOKEN (needs contents: write).
      - name: Checkout develop
        uses: actions/checkout@v4
        with:
          ref: develop
          path: publish

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # 3 + 4 + 5. scripts/build-site.mjs is the same script a developer runs
      #            locally via `npm run build:site` - it merges shared/ then
      #            the active brand's folder under brands/ on top, strips
      #            git/CI scaffolding, and writes straight into the develop
      #            checkout (preserving .git and .github there). Actions
      #            invokes the build now, it no longer owns the assembly
      #            logic. No --brand flag is passed, so it defaults to acme -
      #            unchanged behaviour.
      - name: Build site
        run: |
          cd source
          npm run build:site -- ../publish

      # 6 + 7. Commit and push only if the build actually changed something.
      - name: Publish to develop
        run: |
          set -euo pipefail
          cd publish

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A
          if git diff --cached --quiet; then
            echo "No changes to publish - skipping commit."
          else
            git commit -m "chore: sync shared + brands/acme to develop"
            git push origin develop
          fi
