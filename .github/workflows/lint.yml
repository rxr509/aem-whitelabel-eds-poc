name: Lint

# Blocking lint check for pull requests.
#
# This file only ever lives on `source`. build-and-sync.yml strips .github/ when
# it flattens to `develop`, so it will never run on the generated branches.

on:
  pull_request:

concurrency:
  group: lint-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          # `shared` is a gitlink; without this the lint configs it holds are absent.
          submodules: recursive

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint
