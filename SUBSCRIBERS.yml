shared_repo:
  owner: kxs692
  repo: aem-whitelabel-boilerplate
  branch: demo

subscribers:
  - owner: rxr509
    repo: aem-whitelabel-eds-poc
    branch: source
    # Rate-limiting floor only - it never causes a check, it can only suppress
    # one. The cron in check-shared-updates.yml sets the actual cadence
    # (daily, 09:17 UTC).
    #
    # Keep this well under 1440. At exactly 1440 a late run pushes
    # lastProcessedAt forward, the next on-time run then lands just under 24h
    # later and is skipped - silently degrading the sync to every other day
    # while every log line still reports success.
    min_spacing_minutes: 720
